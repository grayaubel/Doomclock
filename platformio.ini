; Doomclock — smart alarm clock + phone jail
; Two firmwares in one project:
;   pio run -e gateway -t upload     (the clock)
;   pio run -e node    -t upload     (the bed sensor node)
; Shared headers live in include/ (doom_protocol.h is the ESP-NOW wire format).

[platformio]
default_envs = gateway         ; plain "Build/Upload" = the clock. For the bed node pick env:node in the status bar.
; Keep build output (thousands of files) OUT of the project folder. The project lives in an
; iCloud-synced folder, and iCloud evicts/uploads every object file, which makes builds crawl.
; ~/.platformio/workspaces/doomclock on Mac/Linux, %USERPROFILE%\.platformio\... on Windows.
workspace_dir = ${platformio.core_dir}/workspaces/doomclock

[env]
platform = espressif32@^6.9.0        ; Arduino core 2.0.17
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -DCORE_DEBUG_LEVEL=1

[env:gateway]
build_src_filter = +<gateway/>
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv   ; 3 MB app (TFT + AI model) + 896 KB LittleFS, no OTA
lib_deps =
    claws/BH1750@^1.3.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/RTClib@^2.1.4
    knolleary/PubSubClient@^2.8
    bodmer/TFT_eSPI@^2.5.43
; TFT_eSPI is configured here instead of editing the library's User_Setup.h
build_flags =
    ${env.build_flags}
    -DUSER_SETUP_LOADED=1
    -DILI9488_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=19      ; used by the touch controller only (TFT SDO left unconnected)
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DTOUCH_CS=15
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000

[env:node]
build_src_filter = +<node/>
lib_deps =
    pololu/VL53L0X@^1.3.1
